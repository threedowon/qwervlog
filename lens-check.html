<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>qwervlog · 카메라 확인</title><style>*{box-sizing:border-box}body{margin:0 auto;max-width:560px;padding:24px 20px;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:#222;background:#fff}h1{font-size:24px}button,select,textarea{font:inherit;width:100%;padding:12px;border-radius:14px;border:1px solid #ddd;margin:6px 0}button{background:#202020;color:white;min-height:48px}video{display:block;width:100%;max-height:30vh;object-fit:contain;background:#111;border-radius:14px;margin:16px 0}textarea{height:290px;background:#f6f6f4;font-size:13px;resize:vertical}p{font-size:14px;color:#666}[hidden]{display:none!important}#stop{background:#eee;color:#222}</style></head><body><h1>카메라 정보 확인</h1><p>사진이나 영상을 촬영·저장하지 않아요. 기존 모아보기 영상에도 영향을 주지 않아요.</p><button id="start">카메라 정보 확인하기</button><video id="view" autoplay muted playsinline hidden></video><label for="lens">Safari가 알려준 카메라</label><select id="lens" disabled><option>확인하기를 눌러주세요</option></select><textarea id="report" readonly aria-label="카메라 진단 결과">아직 확인하지 않았어요.</textarea><button id="copy" disabled>결과 복사</button><button id="stop" hidden>카메라 끄기</button><p id="status" role="status">확인 결과를 복사해 채팅에 보내주세요.</p><script src="lens-check.js?v=diagnostic41"></script></body></html>
