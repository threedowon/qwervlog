<!DOCTYPE html>

<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#ffffff" name="theme-color"/><title>qwervlog — just stuff i do</title><link href="assets/qwer.jpeg" rel="icon"/><link href="style.css?v=settings8" rel="stylesheet"/></head><body>
<header><a class="brand" href="./"><img alt="" src="assets/qwer.jpeg"/>qwervlog</a><button aria-label="촬영 설정" id="settingsOpen">☷</button></header>
<main><section id="shootScreen"><div id="cameraStage"><section class="viewer"><canvas aria-label="영상과 콜라주 미리보기" height="960" id="preview" width="540"></canvas><video hidden="" id="camera" muted="" playsinline=""></video><div id="empty"><div aria-hidden="true" class="finder"><i></i><i></i><i></i><i></i></div><button aria-label="카메라 열기" id="cameraStart"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><path d="M4 6h4l2-3h4l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"></path><circle cx="12" cy="13" r="4"></circle></svg></button></div><div hidden="" id="counter"></div></section><button aria-label="영상 문구 수정" id="textEdit"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><path d="M4 5h16M12 5v15M8 20h8"></path></svg></button><div class="zoomRow"><input aria-label="카메라 배율" aria-orientation="vertical" id="zoom" max="3" min="1" step="0.1" type="range" value="1"/><output id="zoomValue">1.0×</output></div></div>
<div id="captureDock"><div class="segmented"><button class="selected" id="normal">일반 2초</button><button id="timelapse">타임랩스 6초</button></div>
<div class="shutterRow"><label aria-label="기존 영상 가져오기" class="importButton">＋<input accept="video/*" hidden="" id="upload" type="file"/></label><button aria-label="촬영 시작" id="record"><span></span></button><button aria-label="전면 후면 카메라 전환" id="flip"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><path d="M20 7a8 8 0 0 0-13-3L4 7m0-5v5h5M4 17a8 8 0 0 0 13 3l3-3m0 5v-5h-5"></path></svg></button></div></div>
<div hidden="" id="reviewDock"><p>이 순간, 담아둘까?</p><div><button id="retake">다시 찍기</button><button class="primary" id="keep">담기 ✓</button></div></div></section>
<section hidden="" id="galleryScreen"><div class="galleryTitle"><div><small>MY LITTLE VIDEO DIARY</small><h1>모아둔 순간들.</h1></div><span id="total">0 CUTS · 0초</span></div><div id="galleryStage"></div><button class="subtle" id="editClip">선택한 컷 문구 · 시간 수정</button><div class="clips" id="clips"><p class="hint">아직 담은 순간이 없어요.</p></div><div class="exportRow"><button disabled="" id="play">이어서 보기 ▷</button><button class="primary" disabled="" id="export">영상 저장 ↓</button></div><div hidden="" id="downloadArea"><video controls="" id="result" playsinline=""></video><a class="download" id="download">다운로드</a><button id="share">공유 / 파일에 저장</button></div><p class="footnote">영상은 이 브라우저에만 보관돼요. 중요한 순간은 파일로 저장해 주세요.</p></section></main>
<div class="statusBar"><p id="status" role="status">카메라를 열거나 기존 영상을 가져오세요.</p><button class="danger" hidden="" id="cancel">촬영 취소</button></div><nav aria-label="화면 선택"><button aria-current="page" id="shootTab">◉ <span>촬영</span></button><button id="galleryTab">▦ <span>모아보기</span><b id="cutCount">0</b></button></nav>
<dialog id="settingsSheet"><div class="sheetTop"><h2 id="sheetTitle">촬영 설정</h2><button aria-label="설정 닫기" id="settingsClose">완료</button></div><div class="sheetBody"><div hidden="" id="speedRow"><label for="duration">촬영 시간</label><select id="duration"><option value="10">10초 → 6초 · 약 1.7배속</option><option value="30">30초 → 6초 · 5배속</option><option value="60">60초 → 6초 · 10배속</option></select></div><label for="caption">영상 가운데 문구</label><input id="caption" maxlength="60" value="enjoy a slow evening routine"/><div hidden="" id="timeField"><label for="time">표시 시간</label><input disabled="" id="time" type="time"/></div><label class="toggle"><input checked="" id="collage" type="checkbox"/> 사진 3장 콜라주</label><button id="cameraPreview">카메라로 돌아가기</button><p class="hint">소리는 녹음하지 않아요. 카메라가 열리지 않으면 Safari에서 열어주세요. 가져온 영상에는 가져온 시각이 적용돼요.</p></div></dialog>
<script src="layout.js?v=settings8"></script><script src="camera.js?v=settings8"></script><script src="time.js?v=settings8"></script><script src="app.js?v=settings8"></script></body></html>
