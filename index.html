<!DOCTYPE html>

<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#ffffff" name="theme-color"/><title>qwervlog — just stuff i do</title><link href="assets/qwer.jpeg" rel="icon"/><link href="style.css?v=hour27" rel="stylesheet"/></head><body>
<header><a class="brand" href="./"><img alt="" src="assets/qwer.jpeg"/>qwervlog</a></header>
<main><section id="shootScreen"><div id="cameraStage"><section class="viewer"><canvas aria-label="영상과 콜라주 미리보기" height="1920" id="preview" width="1080"></canvas><video hidden="" id="camera" muted="" playsinline=""></video><div id="empty"><div aria-hidden="true" class="finder"><i></i><i></i><i></i><i></i></div><button aria-label="카메라 열기" id="cameraStart"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><path d="M4 6h4l2-3h4l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"></path><circle cx="12" cy="13" r="4"></circle></svg></button></div><div hidden="" id="counter"></div></section><div id="toolRail"><button aria-label="영상 문구 수정" id="textEdit"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><path d="M4 4h16M12 4v16M8 20h8"></path></svg></button><button aria-label="콜라주 켜기 또는 끄기" aria-pressed="true" id="collageToggle"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><rect height="8" rx="1" width="8" x="3" y="3"></rect><rect height="10" rx="1" width="7" x="14" y="4"></rect><rect height="7" rx="1" width="8" x="5" y="14"></rect></svg></button><button aria-label="촬영 길이 설정" id="durationOpen"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button></div><div class="zoomRow"><input aria-label="카메라 배율" aria-orientation="vertical" id="zoom" max="3" min="1" step="0.01" type="range" value="1"/><output id="zoomValue">1.0×</output><div aria-label="배율 바로 선택" id="zoomPresets"><button aria-label="배율 0.5배" aria-pressed="false" data-zoom="0.5" type="button">0.5×</button><button aria-label="배율 1.0배" aria-pressed="false" data-zoom="1.0" type="button">1.0×</button><button aria-label="배율 1.5배" aria-pressed="false" data-zoom="1.5" type="button">1.5×</button><button aria-label="배율 2.0배" aria-pressed="false" data-zoom="2.0" type="button">2.0×</button></div></div></div>
<div id="captureDock"><div class="segmented"><button class="selected" id="normal">일반 2초</button><button id="timelapse">타임랩스 6초</button></div>
<div class="shutterRow"><label aria-label="기존 영상 가져오기" class="importButton">＋<input accept="video/*" hidden="" id="upload" type="file"/></label><button aria-label="촬영 시작" id="record"><span></span></button><button aria-label="전면 후면 카메라 전환" id="flip"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 24 24"><path d="M20 7a8 8 0 0 0-13-3L4 7m0-5v5h5M4 17a8 8 0 0 0 13 3l3-3m0 5v-5h-5"></path></svg></button></div></div>
<div hidden="" id="reviewDock"><p>이 순간, 담아둘까?</p><div class="reviewTools"><button id="reviewPlay" type="button" aria-pressed="false">▶ 미리보기</button><button id="reviewEdit" type="button">문구 수정</button></div><output id="reviewProgress" aria-label="미리보기 재생 시간"></output><div><button id="retake">다시 찍기</button><button class="primary" id="keep">담기 ✓</button></div></div></section>
<section hidden="" id="galleryScreen"><div class="galleryTitle"><span id="total">0 CUTS · 0초</span></div><div id="galleryStage"></div><div aria-label="영상 순서 목록" class="clips" id="clips"><p class="hint">아직 담은 순간이 없어요.</p></div><div class="exportRow"><button disabled="" id="play">이어서 보기 ▷</button><button class="primary" disabled="" id="export">영상 저장 ↓</button></div><div hidden="" id="downloadArea"><video controls="" id="result" playsinline=""></video><a class="download" id="download">다운로드</a><button id="share">공유 / 파일에 저장</button></div><p class="footnote">영상은 이 브라우저에만 보관돼요. 중요한 순간은 파일로 저장해 주세요.</p></section></main>
<div class="statusBar"><p id="status" role="status">카메라를 열거나 기존 영상을 가져오세요.</p><button class="danger" hidden="" id="cancel">촬영 취소</button></div><nav aria-label="화면 선택"><button aria-current="page" id="shootTab">◉ <span>촬영</span></button><button id="galleryTab">▦ <span>모아보기</span><b id="cutCount">0</b></button></nav>
<input id="caption" type="hidden" value="enjoy a slow evening routine"/><input id="time" type="time" hidden/><input id="collage" type="checkbox" checked hidden/><div id="settingsOverlay" hidden><section aria-label="문구와 시간 편집" aria-modal="true" role="dialog" id="settingsSheet" tabindex="-1"><div class="sheetBody"><div class="captionField"><label for="editCaption">영상 가운데 문구</label><div class="captionInputWrap"><textarea id="editCaption" rows="2" inputmode="text" enterkeyhint="done" autocomplete="off" spellcheck="false" aria-label="영상 가운데 문구">enjoy a slow evening routine</textarea><button aria-label="문구 전체 지우기" id="clearCaption" type="button">×</button></div></div><div hidden="" id="timeField"><label for="editTime">표시 시간</label><input disabled="" id="editTime" type="time"/></div><label class="toggle"><input checked="" id="editCollage" type="checkbox"/> 사진 2~3장 랜덤 콜라주</label></div><div class="sheetTop"><button id="settingsCancel" type="button">취소</button><button aria-label="수정 내용 저장" id="settingsClose" type="button">완료</button></div></section></div>
<dialog aria-label="영상 길이 설정" id="durationSheet"><div class="sheetBody"><label for="clipSeconds">완성 영상 길이 (초)</label><input id="clipSeconds" inputmode="numeric" max="30" min="1" step="1" type="number" value="2"/><div hidden="" id="captureDurationField"><label for="duration">실제 촬영 시간 (초 · 최대 3,600)</label><input id="duration" inputmode="numeric" max="3600" min="6" step="1" type="number" value="30"/></div><p class="hint" id="durationSummary"></p></div><div class="sheetTop"><button id="durationCancel" type="button">취소</button><button id="durationClose" type="button">완료</button></div></dialog><script src="layout.js?v=hour27"></script><script src="camera.js?v=hour27"></script><script src="time.js?v=hour27"></script><script src="app.js?v=hour27"></script></body></html>
